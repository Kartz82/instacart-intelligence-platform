version: 2

models:
  - name: mart_cohort_retention
    description: Order-sequence retention mart showing how many customers reach each observed order milestone.
    columns:
      - name: order_sequence_index
        description: Zero-based index from each customer's first observed order.
        tests:
          - not_null
          - unique
      - name: observed_order_number
        description: One-based observed order milestone for BI presentation.
        tests:
          - not_null
      - name: starting_customers
        description: Count of customers in the observed dataset.
        tests:
          - not_null
      - name: active_customers
        description: Count of customers observed at this order-sequence index.
        tests:
          - not_null
      - name: retention_rate
        description: Active customers divided by starting customers.
        tests:
          - not_null

  - name: mart_basket_affinity
    description: SQL-first product affinity mart for frequently co-occurring product pairs.
    columns:
      - name: product_a_id
        description: First product in the pair, using lower product_id for stable pair direction.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: product_a_name
        tests:
          - not_null
      - name: product_b_id
        description: Second product in the pair, using higher product_id for stable pair direction.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: product_b_name
        tests:
          - not_null
      - name: orders_with_a
        tests:
          - not_null
      - name: orders_with_b
        tests:
          - not_null
      - name: orders_with_both
        tests:
          - not_null
      - name: support
        description: Orders containing both products divided by total orders.
        tests:
          - not_null
      - name: confidence_a_to_b
        description: Orders containing both products divided by orders containing product A.
        tests:
          - not_null
      - name: lift
        description: Confidence A to B divided by product B order share.
        tests:
          - not_null

  - name: mart_time_patterns
    description: >
      Order volume and reorder intensity across day-of-week x hour-of-day. Source for
      the Temporal Behavior heatmap. Built off dim_time so the 168-slot grid is always
      complete. Order counts come from dim_orders and item counts from fact_order_items,
      aggregated separately so orders are not multiplied by basket size.
    columns:
      - name: time_key
        description: Surrogate key inherited from dim_time.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: order_dow
        tests:
          - not_null
      - name: order_day_of_week
        tests:
          - not_null
      - name: order_hour_of_day
        tests:
          - not_null
      - name: daypart
        tests:
          - not_null
      - name: is_weekend
        tests:
          - not_null
      - name: total_orders
        description: Orders placed in this day-of-week x hour slot.
        tests:
          - not_null
      - name: distinct_customers
        tests:
          - not_null
      - name: total_order_items
        description: Order line items in this slot.
        tests:
          - not_null
      - name: reordered_items
        tests:
          - not_null
      - name: reorder_rate
        description: Reordered items divided by total order items in this slot.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: share_of_total_orders
        description: Slot orders divided by all orders on the platform.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
