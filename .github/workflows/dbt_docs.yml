name: dbt docs to GitHub Pages

# Publishes the dbt lineage graph and model documentation to GitHub Pages.
#
# `dbt docs generate --static` emits a single self-contained index.html with the
# manifest and catalog inlined, which is what makes it publishable as a static site
# with no server behind it.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Uses the same secrets as dbt_build.yml.

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt_docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      BQ_DATASET: ${{ secrets.BQ_DATASET }}
      DBT_RAW_SCHEMA: ${{ secrets.BQ_RAW_DATASET }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write the service-account key
        run: |
          printf '%s' '${{ secrets.GCP_SA_KEY }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Install dbt packages
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Generate static docs
        run: dbt docs generate --static --project-dir dbt --profiles-dir dbt --target bigquery

      - name: Assemble the site
        run: |
          mkdir -p site
          cp dbt/target/static_index.html site/index.html

      - name: Remove the service-account key
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
