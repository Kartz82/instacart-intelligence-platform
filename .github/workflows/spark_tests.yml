name: Spark + Airflow tests

# Runs without any secrets, so it can go green on every push.
#
#   spark job    PySpark ports vs the real dbt models (built on DuckDB over a synthetic
#                sample), incremental-vs-full convergence, quality gates, stage wiring
#   airflow job  DAG integrity: imports, dbt_test gating, alerts, backfill ordering

on:
  push:
    branches: [main]
    paths: ["spark/**", "dbt/**", "airflow/**", ".github/workflows/spark_tests.yml"]
  pull_request:
    paths: ["spark/**", "dbt/**", "airflow/**", ".github/workflows/spark_tests.yml"]
  workflow_dispatch:

jobs:
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r spark/requirements-dev.txt

      - name: Install dbt packages for the reference build
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Run tests (Delta enabled; the runner can download the Delta jars)
        working-directory: spark
        env:
          DBT_ORACLE_PROJECT_DIR: ${{ github.workspace }}/dbt
          TEST_WITH_DELTA: "1"
        run: pytest tests -v

  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Airflow (version matched to Astro Runtime 3.3-8)
        run: |
          pip install "apache-airflow==3.3.2" "apache-airflow-providers-databricks>=7.0" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt"
      - name: DAG integrity tests
        working-directory: airflow
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
        run: pytest tests -v
